services:
  nginx:
    image: nginx:alpine
    container_name: blue-ride-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - core-service
  postgres:
    image: postgres:17
    container_name: blue-ride-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: blue_ride_postgres
      POSTGRES_USER: ${POSTGRES_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d blue_ride_postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  core-service:
    build:
      context: ../../backend/core-service
    container_name: blue-ride-core-service
    restart: unless-stopped
    expose:
    - "8080"
    environment:
      POSTGRES_URL: ${POSTGRES_URL:-jdbc:postgresql://postgres:5432/blue_ride_postgres}
      POSTGRES_USERNAME: ${POSTGRES_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
