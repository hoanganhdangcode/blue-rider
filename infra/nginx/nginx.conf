events {}

http {
    server {
        listen 80;
        server_name _;

        location /api/core/ {
            proxy_pass http://core-service:8080/;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Prefix /api/core;
        }
    }
}