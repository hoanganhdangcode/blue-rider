name: Social Service CI

on:
  push:
    branches:
      - develop
      - main
    paths:
      - 'backend/social-service/**'
      - '.github/workflows/social-service-ci.yml'
  pull_request:
    paths:
      - 'backend/social-service/**'
      - '.github/workflows/social-service-ci.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Test
        run: echo "Social Service CI - ${{ github.ref_name }}"
