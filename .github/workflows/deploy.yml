name: Deploy

on:
  push:
    branches:
      - develop
      - main
    paths:
      - 'backend/**'
      - 'infra/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  staging:
    name: Deploy Staging (VPS)
    if: github.ref_name == 'develop'
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$VPS_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Sync .env to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
          POSTGRES_USERNAME: ${{ secrets.POSTGRES_USERNAME }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          printf 'POSTGRES_URL=%s\nPOSTGRES_USERNAME=%s\nPOSTGRES_PASSWORD=%s\n' \
            "$POSTGRES_URL" "$POSTGRES_USERNAME" "$POSTGRES_PASSWORD" \
            | ssh "$VPS_USER@$VPS_HOST" 'cat > ~/blue-rider/.env && chmod 600 ~/blue-rider/.env'

      - name: Deploy Staging
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh "$VPS_USER@$VPS_HOST" << 'EOF'
            set -e

            cd ~/blue-rider

            git fetch origin develop
            git reset --hard origin/develop

            docker compose \
              -f infra/docker/compose.yml \
              up -d --build

            docker compose \
              -f infra/docker/compose.yml \
              ps
          EOF

  production:
    name: Deploy Production (disabled)
    # TODO: bật deploy production khi sẵn sàng — thay step dưới bằng flow SSH giống staging.
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Placeholder
        run: echo "Production deploy đang tắt. Chỉ bật khi sẵn sàng."
