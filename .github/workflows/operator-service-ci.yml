name: Operator Service CI

on:
  push:
    branches:
      - develop
      - main
    paths:
      - 'backend/operator-service/**'
      - '.github/workflows/operator-service-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: operator-service-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Vet & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/operator-service

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: backend/operator-service/go.mod

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

  notify:
    name: Telegram Notify
    needs: [test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Send result
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEST_RESULT: ${{ needs.test.result }}
          ACTOR: ${{ github.actor }}
          BRANCH: ${{ github.ref_name }}
          EVENT: ${{ github.event_name }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "::warning::Thiếu TELEGRAM_BOT_TOKEN hoặc TELEGRAM_CHAT_ID (PR từ fork không có repo secrets). Bỏ qua gửi thông báo."
            exit 0
          fi

          if [ "$TEST_RESULT" = "success" ]; then
            ICON="✅"
            TITLE="Operator Service CI PASSED"
          else
            ICON="❌"
            TITLE="Operator Service CI FAILED"
          fi

          MESSAGE=$(cat <<EOFMSG
          ${ICON} ${TITLE}
          Event: ${EVENT}
          Editor: ${ACTOR}
          Branch: ${BRANCH}
          Commit: ${SHA}
          Test: ${TEST_RESULT}
          Log: ${RUN_URL}
          EOFMSG
          )

          curl -sf -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MESSAGE}" \
            || echo "::warning::Gửi thông báo Telegram thất bại"
