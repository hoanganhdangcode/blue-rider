name: Core Service CI

on:
  push:
    branches:
      - develop
      - main
    paths:
      - 'backend/core-service/**'
      - 'backend/crypto/**'
      - '.github/workflows/core-service-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core-service-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint & Test (Postgres Docker)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/core-service

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: blue_ride_postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_URL: jdbc:postgresql://localhost:5432/blue_ride_postgres
      POSTGRES_USERNAME: postgres
      POSTGRES_PASSWORD: postgres

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test crypto module
        run: ./gradlew -p ../crypto test --no-daemon

      - name: Lint (Checkstyle)
        run: ./gradlew check --no-daemon

      - name: Test (Flyway migrate + JPA validate)
        run: ./gradlew test --no-daemon

      - name: Upload Test Reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: core-service-test-reports-${{ github.run_id }}
          path: backend/core-service/build/reports/tests/test/
          if-no-files-found: ignore

  notify:
    name: Telegram Notify
    needs: [test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Send result
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEST_RESULT: ${{ needs.test.result }}
          ACTOR: ${{ github.actor }}
          BRANCH: ${{ github.ref_name }}
          EVENT: ${{ github.event_name }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "::warning::Thiếu TELEGRAM_BOT_TOKEN hoặc TELEGRAM_CHAT_ID (PR từ fork không có repo secrets). Bỏ qua gửi thông báo."
            exit 0
          fi

          if [ "$TEST_RESULT" = "success" ]; then
            ICON="✅"
            TITLE="Core Service CI PASSED"
          else
            ICON="❌"
            TITLE="Core Service CI FAILED"
          fi

          MESSAGE=$(cat <<EOFMSG
          ${ICON} ${TITLE}
          Event: ${EVENT}
          Editor: ${ACTOR}
          Branch: ${BRANCH}
          Commit: ${SHA}
          Test: ${TEST_RESULT}
          Log: ${RUN_URL}
          EOFMSG
          )

          curl -sf -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MESSAGE}" \
            || echo "::warning::Gửi thông báo Telegram thất bại"
