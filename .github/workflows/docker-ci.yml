name: Docker CI

on:
  push:
    branches:
      - develop
      - main
    paths:
      - 'infra/docker/**'
      - '.github/workflows/docker-ci.yml'
  pull_request:
    paths:
      - 'infra/docker/**'
      - '.github/workflows/docker-ci.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Test
        run: echo "Docker CI - ${{ github.ref_name }}"
