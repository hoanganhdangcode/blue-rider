spring.datasource.url=jdbc:h2:mem:coretest;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

jwt.keys.directory=${java.io.tmpdir}/blueride-core-test-keys

auth.otp.mock.enabled=true
auth.otp.mock.code=456789
