spring.application.name=core-service

# Xử lý forwarded headers từ nginx (X-Forwarded-Prefix / X-Forwarded-Proto ...)
# để springdoc/swagger-ui tạo đúng URL khi chạy sau reverse proxy có prefix.
server.forward-headers-strategy=framework

spring.datasource.url=${POSTGRES_URL:jdbc:postgresql://localhost:5432/blue_ride_postgres}
spring.datasource.username=${POSTGRES_USERNAME:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
