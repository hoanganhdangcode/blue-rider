spring.application.name=core-service
server.port=${SERVER_PORT:8080}

spring.datasource.url=${POSTGRES_URL:jdbc:postgresql://localhost:5432/blue_ride_postgres}
spring.datasource.username=${POSTGRES_USERNAME:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

internal.api-key=${INTERNAL_API_KEY:dev-internal-key}
kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

jwt.private-key-pem=${JWT_PRIVATE_KEY_PEM:}
jwt.public-key-pem=${JWT_PUBLIC_KEY_PEM:}
