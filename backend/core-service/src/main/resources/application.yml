jwt:
  keys:
    directory: ${JWT_KEYS_DIRECTORY:/app/keys}
    private-key: ${JWT_PRIVATE_KEY:${jwt.keys.directory}/private.key}
    public-key: ${JWT_PUBLIC_KEY:${jwt.keys.directory}/public.key}
    rsa-key-size: ${JWT_RSA_KEY_SIZE:2048}

auth:
  otp:
    mock:
      enabled: ${MOCK_OTP_ENABLED:true}
      code: ${MOCK_OTP_CODE:456789}
