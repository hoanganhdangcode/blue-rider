spring.application.name=gateway-service
server.port=${SERVER_PORT:8080}

gateway.internal-api-key=${INTERNAL_API_KEY:dev-internal-key}
gateway.core-base-url=${CORE_BASE_URL:http://localhost:8081}
gateway.operator-base-url=${OPERATOR_BASE_URL:http://localhost:8082}
gateway.connect-timeout-ms=${GATEWAY_CONNECT_TIMEOUT_MS:3000}
gateway.read-timeout-ms=${GATEWAY_READ_TIMEOUT_MS:5000}

jwt.private-key-pem=${JWT_PRIVATE_KEY_PEM:}
jwt.public-key-pem=${JWT_PUBLIC_KEY_PEM:}
